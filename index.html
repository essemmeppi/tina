<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Per Tina</title>
  <meta name="description" content="Un piccolo regalo per Tina — il mood musicale di ogni giorno, su NTS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    :root {
      --cream: #F5F2E8;
      --text-muted: #6B6052;
      --text-deep: #2A2520;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--cream);
      font-family: 'Instrument Serif', Georgia, serif;
      color: var(--text-deep);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      animation: fadeIn 1.2s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    main {
      width: 100%;
      max-width: 720px;
      text-align: center;
    }
    .greeting {
      font-size: clamp(17px, 2.2vw, 19px);
      color: var(--text-muted);
      line-height: 1.55;
      margin: 0 auto 2.5rem;
      max-width: 480px;
    }
    .mood-wrap {
      padding: clamp(4rem, 10vw, 7rem) 0;
      margin: 0 auto 1.5rem;
      max-width: 640px;
      transition: background 0.6s ease;
    }
    #mood {
      font-size: clamp(56px, 13vw, 104px);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .desc {
      font-style: italic;
      font-size: clamp(15px, 2vw, 17px);
      color: var(--text-muted);
      margin: 0 auto 2.75rem;
      max-width: 420px;
      line-height: 1.55;
    }
    .listen {
      display: inline-block;
      font-size: 14px;
      color: var(--text-muted);
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-thickness: 0.5px;
      letter-spacing: 0.03em;
      transition: color 0.3s ease;
    }
    .listen:hover { color: var(--text-deep); }
    .others-label {
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 10px;
      color: var(--text-muted);
      margin: 6rem 0 1.25rem;
      letter-spacing: 0.2em;
      opacity: 0.5;
      text-transform: uppercase;
    }
    .others {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 560px;
      margin: 0 auto;
    }
    .swatch {
      border-radius: 12px;
      padding: 18px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      text-decoration: none;
      transition: transform 0.25s ease;
    }
    .swatch:hover { transform: translateY(-2px); }
    .swatch-name {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: clamp(14px, 2vw, 17px);
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    @media (max-width: 480px) {
      .others-label { margin-top: 4rem; }
      .swatch { min-height: 56px; padding: 14px 8px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="greeting">
      Ciao Tina,<br>
      è il <span id="data"></span> e il mood di oggi è:
    </p>

    <div class="mood-wrap" id="mood-wrap">
      <h1 id="mood"></h1>
    </div>

    <p class="desc" id="desc"></p>

    <a class="listen" id="link" target="_blank" rel="noopener">ascolta ora →</a>

    <p class="others-label">gli altri mood</p>

    <div class="others" id="others"></div>
  </main>

  <script>
    // Per modificare i mood, edita questo array.
    // Ogni voce ha:
    //   - name: testo mostrato (lowercase, in inglese come su NTS)
    //   - slug: parte finale dell'URL NTS (https://www.nts.live/infinite-mixtapes/SLUG)
    //   - desc: descrizione italiana mostrata sotto il mood
    //   - text: colore scuro per il testo
    //   - swatch: colore di sfondo del riquadrino in basso
    //   - stops: 4 colori del gradiente radiale, dal centro saturo (al 75% di intensità)
    //            verso il bordo (5° stop = trasparente, gestito automaticamente)
    const moods = [
      {
        name: "poolside",
        slug: "poolside",
        desc: "balearica, boogie e sophisti-pop per spiagge e auto sotto il sole",
        text: "#1F4F66",
        swatch: "#E0EDF2",
        stops: ["#A1C1D1", "#BBCFDB", "#D3E1EA", "#E5EDF1"]
      },
      {
        name: "slow focus",
        slug: "slow-focus",
        desc: "meditativo, beatless — ambient, drone e raga per perdersi piano",
        text: "#04342C",
        swatch: "#E1F5EE",
        stops: ["#9BD8BD", "#B9E1CC", "#D5EEE3", "#E5F4ED"]
      },
      {
        name: "low key",
        slug: "100-percent-hip-hop",  // slug legacy NTS
        desc: "downtempo, hip-hop d'epoca, slow jam morbide",
        text: "#3C3489",
        swatch: "#ECEAFB",
        stops: ["#B5B0E0", "#C8C3EA", "#DCD9F2", "#EBE9FA"]
      },
      {
        name: "memory lane",
        slug: "memory-lane",
        desc: "folk controculturale, psichedelia, soul dolce e garage rock",
        text: "#72243E",
        swatch: "#FBE8EE",
        stops: ["#E8B4C5", "#EEC6D3", "#F4D7DD", "#F9E6EB"]
      },
      {
        name: "4 to the floor",
        slug: "4-to-the-floor",
        desc: "house e techno, dal passato al presente",
        text: "#993C1D",
        swatch: "#FBD9CB",
        stops: ["#EAA487", "#F1B89F", "#F6CCB7", "#FAD9C8"]
      },
      {
        name: "island time",
        slug: "island-time",
        desc: "easy skanking — reggae, dub e ritmi caraibici",
        text: "#27500A",
        swatch: "#E6F0D5",
        stops: ["#B5D17F", "#C5DA98", "#D5E3B2", "#E2EDCC"]
      },
      {
        name: "sheet music",
        slug: "sheet-music",
        desc: "il meglio della musica classica e contemporanea",
        text: "#5C4115",
        swatch: "#F2EBD8",
        stops: ["#DDCC95", "#E5D5A8", "#EBDEBC", "#F0E7CE"]
      },
      {
        name: "feelings",
        slug: "feelings",
        desc: "soul dolce, gospel, boogie e oltre",
        text: "#854F0B",
        swatch: "#FAE9D0",
        stops: ["#EFC07F", "#F3CE9A", "#F6D9B0", "#F9E5C6"]
      },
      {
        name: "expansions",
        slug: "expansions",
        desc: "jazz e le sue infinite variazioni cosmiche, da Sun Ra in poi",
        text: "#7A3E0A",
        swatch: "#F3D6B0",
        stops: ["#E2A465", "#E8B581", "#EDC59C", "#F1D2AC"]
      },
      {
        name: "field recordings",
        slug: "field-recordings",
        desc: "ambienti naturali registrati dagli ascoltatori NTS nel mondo",
        text: "#3A4318",
        swatch: "#E6E3CC",
        stops: ["#B4AC76", "#C1BB91", "#CFC9A8", "#DDD7BF"]
      }
    ];

    const mesi = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];

    // Knob globale per l'intensità dei colori del gradiente.
    // 0 = colori originali a piena intensità
    // 0.15 = leggermente diluiti verso il crema dello sfondo (default)
    // 0.3 = molto diluiti, quasi impalpabili
    const DILUTION = 0.15;

    // Mescola un colore hex col crema dello sfondo per ammorbidirlo.
    function dilute(hex, amount) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      // Crema dello sfondo: #F5F2E8 = (245, 242, 232)
      return '#' + [
        Math.round(r * (1-amount) + 245 * amount),
        Math.round(g * (1-amount) + 242 * amount),
        Math.round(b * (1-amount) + 232 * amount)
      ].map(x => x.toString(16).padStart(2, '0')).join('');
    }

    function buildGradient(stops) {
      const d = stops.map(s => dilute(s, DILUTION));
      // "closest-side" fa sì che l'ellisse si adatti al box e sfumi a trasparente
      // prima di toccarne i bordi -- niente gradini visibili
      return `radial-gradient(ellipse closest-side at center, ${d[0]} 0%, ${d[1]} 7%, ${d[2]} 22%, ${d[3]} 45%, transparent 80%)`;
    }

    function pickToday() {
      const d = new Date();
      // Seed deterministico: stesso giorno -> stesso mood per tutti
      const seed = d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
      return moods[seed % moods.length];
    }

    function formatItalianDate() {
      const d = new Date();
      return `${d.getDate()} ${mesi[d.getMonth()]} ${d.getFullYear()}`;
    }

    function render() {
      const today = pickToday();

      document.getElementById('data').textContent = formatItalianDate();

      const moodEl = document.getElementById('mood');
      moodEl.textContent = today.name;
      moodEl.style.color = today.text;

      document.getElementById('mood-wrap').style.background = buildGradient(today.stops);

      document.getElementById('desc').textContent = today.desc;
      document.getElementById('link').href = `https://www.nts.live/infinite-mixtapes/${today.slug}`;

      const othersEl = document.getElementById('others');
      othersEl.innerHTML = '';
      moods.filter(m => m.slug !== today.slug).forEach(m => {
        const a = document.createElement('a');
        a.href = `https://www.nts.live/infinite-mixtapes/${m.slug}`;
        a.className = 'swatch';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.style.background = m.swatch;
        const p = document.createElement('p');
        p.className = 'swatch-name';
        p.style.color = m.text;
        p.textContent = m.name;
        a.appendChild(p);
        othersEl.appendChild(a);
      });
    }

    render();
  </script>
</body>
</html>
